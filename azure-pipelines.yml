trigger:
- main

# 使用你在 Azure DevOps 创建的私有池（比如 Default 或 SelfHosted）
pool:
  name: Default
  demands: agent.name -equals metapipeline   # 可选，指定具体代理

steps:
# 安装 Node.js 22.18.0
- task: NodeTool@0
  inputs:
    versionSpec: '22.18.0'
  displayName: 'Install Node.js 22.18.0'

# 安装 pnpm
- script: |
    npm install -g pnpm@10.32.1
  displayName: 'Install pnpm'

# 安装依赖
- script: |
    pnpm install
  displayName: 'pnpm install'

# 构建项目（静态生成）
- script: |
    pnpm generate
  displayName: 'pnpm generate'

# 部署到 Cloudflare Pages
- script: |
    npx wrangler pages deploy ./dist --project-name=blog-v3 --branch=main
  displayName: 'Deploy to Cloudflare Pages'
  env:
    CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
    CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
